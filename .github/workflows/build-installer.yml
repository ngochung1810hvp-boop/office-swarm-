name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag version (e.g. 0.1.0). If set, workflow will create/push tag v<version> then build + release.'
        required: false
        type: string
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create and push tag (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.version != '' }}
        shell: pwsh
        run: |
          $tag = "v${{ inputs.version }}"
          git tag $tag
          git push origin $tag

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install Inno Setup 6
        shell: pwsh
        run: |
          choco install innosetup --no-progress --yes

      - name: Build Windows installer
        shell: pwsh
        run: |
          .\scripts\installer\Build-WindowsInstaller.ps1 -AutoInstallInno -AppVersion "${{ github.ref_name }}"

      - name: List build output
        shell: pwsh
        run: |
          Get-ChildItem dist\installer | Format-Table Name, Length, LastWriteTime

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiLamVanPhong-Windows-Installer
          path: dist/installer/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/installer/*.exe
          generate_release_notes: true
          draft: false
          prerelease: false
